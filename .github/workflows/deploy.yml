name: CI/CD Vite React → EC2

on:
  push:
    branches: 
      - portfolio-v2

jobs:
  build:
    name: 🛠 Build with Vite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        
      - name: Build app
        run: npm run build   

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist

  deploy:
    name: 🚀 Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: dist

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Sync to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT || 22 }}" \
            dist/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/portfolio/dist/

      - name: Reload Nginx
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.EC2_PORT || 22 }} \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo nginx -t
            sudo systemctl reload nginx
          EOF
