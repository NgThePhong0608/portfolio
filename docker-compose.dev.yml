services:
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      DOCKER_DEV: "true"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  portfolio_node_modules:
